<!-- ============================================================
     PARTIAL COMPARTIDO: menú de usuario + apartados "En línea" y "Perfil"
     Se incluye igual en todas las páginas admin_*.html para mantener
     el mismo topbar, el mismo comportamiento y evitar código duplicado.
     ============================================================ -->


<!-- Modal: Perfil -->
<div class="pm-overlay" id="pmOverlayPerfil">
    <div class="pm-modal">
        <div class="pm-modal-header">
            <h3><i class="fa-solid fa-user-gear"></i> Mi perfil</h3>
            <button class="pm-modal-close" onclick="pmCerrarModal('pmOverlayPerfil')">&times;</button>
        </div>
        <div class="pm-modal-body">
            <div class="pm-perfil-foto-row">
                <div id="pmPerfilFotoPreview" class="pm-perfil-foto-preview">A</div>
                <div>
                    <label class="pm-perfil-upload">
                        <i class="fa-solid fa-camera"></i> Cambiar foto
                        <input type="file" id="pmInputFoto" accept="image/png,image/jpeg,image/gif,image/webp">
                    </label>
                    <p class="inline-style-1">JPG, PNG, GIF o WEBP</p>
                </div>
            </div>

            <form id="pmFormPerfil" onsubmit="return pmGuardarPerfil(event)">
                <div class="pm-form-group">
                    <label>Usuario</label>
                    <input type="text" id="pmPerfilUsername" disabled>
                </div>
                <div class="pm-form-group">
                    <label>Nombre</label>
                    <input type="text" id="pmPerfilNombre" name="nombre" required>
                </div>
                <div class="pm-form-group">
                    <label>Puesto</label>
                    <input type="text" id="pmPerfilPuesto" name="puesto">
                </div>
                <div id="pmPerfilMsg"></div>
                <div class="pm-form-footer">
                    <button type="button" class="pm-btn pm-btn-secondary" onclick="pmCerrarModal('pmOverlayPerfil')">Cancelar</button>
                    <button type="submit" class="pm-btn pm-btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
