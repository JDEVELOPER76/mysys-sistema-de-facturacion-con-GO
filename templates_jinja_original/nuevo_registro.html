<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Nuevo Usuario</title>
    
    <link rel="stylesheet" href="{{ url_for('static', path='css/register.css') }}">
</head>
<body>

    <main class="register-card">
        <div class="card-header">
            <h1>Registro de Usuario</h1>
            <p>Por favor, complete los siguientes campos para crear una nueva cuenta.</p>
        </div>

        <!-- Mensajes de Feedback (Jinja2) -->
        {% if request.query_params.get('error') %}
            <div class="alert alert-error">
                {{ request.query_params.get('error') }}
            </div>
        {% endif %}
        
        {% if request.query_params.get('success') %}
            <div class="alert alert-success">
                {{ request.query_params.get('success') }}
            </div>
        {% endif %}

        <!-- Formulario -->
        <!-- Ajusta el 'action' a la ruta de tu backend -->
        <form action="/registro" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ej. juan.perez" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8">
                    <button type="button" class="toggle-password" onclick="togglePass()">Mostrar</button>
                </div>
            </div>

            <div class="form-group">
                <label for="rol">Tipo de Rol</label>
                <select id="rol" name="rol" required>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Registrar Usuario</button>
        </form>
    </main>

    
    <script src="{{ url_for('static', path='js/register.js') }}"></script>
</body>
</html>
