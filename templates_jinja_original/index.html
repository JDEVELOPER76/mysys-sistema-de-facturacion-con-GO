<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySYS Login</title>
    
    <link rel="stylesheet" href="{{ url_for('static', path='css/index.css') }}">
</head>
<body>

    <main class="login-card">
        <div class="card-header">
            <!-- Logo del sistema -->
            <div class="logo-container">
                <img src="./static/logo/fondo.png" alt="Logo MySYS">
            </div>
            <h1>Bienvenido</h1>
            <div class="subtitle">Acceso a MySYS</div>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Mensajes de Feedback (Jinja2) -->
        {% if request.query_params.get('error') %}
            <div class="alert alert-error">
                {{ request.query_params.get('error') }}
            </div>
        {% endif %}
        
        {% if request.query_params.get('success') %}
            <div class="alert alert-success">
                {{ request.query_params.get('success') }}
            </div>
        {% endif %}

        <!-- Formulario de Login -->
        <!-- Ajusta el 'action' a la ruta real de tu backend -->
        <form action="/login" method="POST" autocomplete="off">
            
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                    <button type="button" class="toggle-password" onclick="togglePass()">Mostrar</button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>
    </main>

    
    <script src="{{ url_for('static', path='js/index.js') }}"></script>
</body>
</html>
